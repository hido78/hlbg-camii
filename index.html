<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hohenlimburg Camii Namaz Panosu</title>
    <style>
        :root {
            --primary: #004d40;
            --accent: #ffc107;
            --glass: rgba(255, 255, 255, 0.95);
            --text: #2c3e50;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: linear-gradient(135deg, #004d40 0%, #00251a 100%);
            color: var(--text);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        body.cursor-hidden * {
            cursor: none !important;
        }
        .main-container {
            width: 99vw;
            height: 99vh;
            display: grid;
            grid-template-columns: 1.3fr 1.5fr;
            grid-template-rows: auto 1fr auto;
            gap: 20px;
            background: var(--glass);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
        }
        @media (max-aspect-ratio: 1/1) {
            .main-container {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto 1fr auto;
                height: 98vh;
                overflow-y: auto;
            }
        }
	.header {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: 1fr auto; /* Linke Seite dehnt sich aus, rechte Seite bleibt fest am rechten Rand */
            align-items: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            gap: 20px;
            width: 100%;
            box-sizing: border-box;
        }
        
        .logo-area { 
            display: flex; 
            align-items: center; 
            gap: 20px; 
            min-width: 0; /* Verhindert, dass das Grid gesprengt wird */
        }
        
        .logo-area img { 
            height: 160px; 
            flex-shrink: 0; 
        }
        
        .logo-area h1 { 
            font-size: 7.0rem; /* Hier können Sie Ihre Wunschgröße frei einstellen */
            color: var(--primary); 
            font-weight: 800; 
            letter-spacing: -1px; 
            white-space: nowrap; 
        }
        
        .header-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 2px;
            min-width: 0; /* Hält die rechte Seite stabil im rechten Grid-Bereich */
        }
        
        .date-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .header-right .miladi { font-size: 2.1rem; font-weight: bold; white-space: nowrap; }
        .header-right .hicri  { color: var(--primary); font-size: 2.1rem; font-weight: bold; white-space: nowrap; }
        .date-divider { font-size: 2.1rem; color: #999; font-weight: bold; white-space: nowrap; }
        
        .live-clock {
            font-size: 10rem; /* Hier können Sie die Uhrzeit beliebig vergrößern */
            font-weight: 900;
            color: var(--primary);
            line-height: 1;
            white-space: nowrap;
        }
        
        .vakitler-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            grid-column: 1 / -1;
            height: 100%;
        }
        .vakit-card {
            background: #f8f9fa;
            padding: 20px 10px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: all 0.3s ease;
            border: 2px solid #ddd;
            position: relative;
        }
        .vakit-card.active {
            background: var(--primary);
            color: white;
            transform: scale(1.05);
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
            border: none;
        }
        .vakit-card .label { font-size: 4.0rem; text-transform: uppercase; margin-bottom: 15px; font-weight: 700; opacity: 0.9; }
        .vakit-card .time  { font-size: 8rem; font-weight: 800; }
        
        .countdown-box {
            background: #e0f2f1;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        #status-display { font-size: 3.7rem; font-weight: 700; text-align: center; }
        .countdown-timer {
            font-size: 12rem;
            font-weight: 900;
            color: var(--primary);
            font-variant-numeric: tabular-nums;
            display: block;
            margin-top: 15px;
            line-height: 1;
        }
        .weather-box {
            background: #fff;
            border-radius: 24px;
            padding: 30px;
            border: 2px solid #eee;
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            align-items: center;
            gap: 20px;
        }
        .weather-main { text-align: center; }
        .weather-main .temp { font-size: 7.5rem; font-weight: bold; color: var(--primary); margin: 5px 0; }
        #w-desc { font-size: 2.6rem; font-weight: 600; color: #555; text-transform: capitalize; }
        .weather-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            font-size: 2.8rem; 
            border-left: 5px solid #eee;
            padding-left: 40px;
        }
        .w-item { display: flex; flex-direction: column; gap: 9px; }
        .w-item span:first-child { font-weight: bold; color: #777; }
    </style>
</head>
<body>
<div class="main-container">
    <header class="header">
        <div class="logo-area">
            <img src="https://upload.wikimedia.org/wikipedia/de/6/62/DITIB-Logo.svg" alt="DİTİB">
            <h1>Hohenlimburg Camii</h1>
        </div>
        <div class="header-right">
            <div class="live-clock" id="clock">00:00</div>
            <div class="date-row">
                <div class="hicri"  id="hicri-date">-- --- ----</div>
                <div class="date-divider">|</div>
                <div class="miladi" id="miladi-date">-- --- ----</div>
            </div>
        </div>
    </header>
    
    <div class="vakitler-grid">
        <!-- İmsak & Güneş (Teilen sich Zelle Index 0) -->
        <div class="vakit-card">
            <div class="label">İmsak</div> 
            <div class="time" id="t0">--:--</div>
            <div style="position: absolute; bottom: 15px; left: 0; right: 0; font-size: 2.2rem; font-weight: 700; opacity: 0.85;">Güneş: <span id="t1">--:--</span></div>
        </div>
        <!-- Versteckte Zelle (Index 1) bleibt für Grid-Struktur erhalten -->
        <div class="vakit-card" style="display: none;"></div>
        
        <div class="vakit-card"><div class="label">Öğle</div>  <div class="time" id="t2">--:--</div></div>
        <div class="vakit-card"><div class="label">İkindi</div><div class="time" id="t3">--:--</div></div>
        <div class="vakit-card"><div class="label">Akşam</div> <div class="time" id="t4">--:--</div></div>
        <div class="vakit-card"><div class="label">Yatsı</div> <div class="time" id="t5">--:--</div></div>
    </div>
    
    <div class="countdown-box">
        <div id="status-display">Yükleniyor...</div>
    </div>
    
    <div class="weather-box">
        <div class="weather-main">
            <div style="font-size:2.4rem;font-weight:600;">Hava Durumu</div>
            <div class="temp" id="w-temp">--°C</div>
            <div id="w-desc">--</div>
        </div>
        <div class="weather-details">
            <div class="w-item"><span>Hissedilen</span><span id="w-feel">--°C</span></div>
            <div class="w-item"><span>Nem</span>       <span id="w-hum">%--</span></div>
            <div class="w-item"><span>Rüzgar</span>    <span id="w-wind">-- km/sa</span></div>
            <div class="w-item"><span>Basınç</span>    <span id="w-pres">-- hPa</span></div>
        </div>
    </div>
</div>

<script>
// ── Mauszeiger ausblenden ─────────────────────────────────────────
let cursorTimer;
function resetCursorTimer() {
    document.body.classList.remove('cursor-hidden');
    clearTimeout(cursorTimer);
    cursorTimer = setTimeout(() => {
        document.body.classList.add('cursor-hidden');
    }, 1000);
}
document.addEventListener('mousemove', resetCursorTimer);
document.addEventListener('mousedown', resetCursorTimer);
resetCursorTimer();

// ── Konfiguration ─────────────────────────────────────────────────
const LAT = 51.3508, LON = 7.5683;
// NEUE PROXY-URL EINGETRAGEN
const PROXY_URL   = 'https://namaz-vakitleri.ditib-hohenlimburg.workers.dev/'; 
const PRAYER_KEY  = 'diy-prayer-v6';
const WEATHER_KEY = 'diy-weather-v1';
const WEATHER_TTL = 15 * 60 * 1000;
const vakitNames = ['İmsak', 'Güneş', 'Öğle', 'İkindi', 'Akşam', 'Yatsı'];
let prayers = [];

function hhmm(v) {
    if (!v) return null;
    const m = String(v).match(/(\d{1,2}):(\d{2})/);
    return m ? `${m[1].padStart(2,'0')}:${m[2]}` : null;
}

function savePrayer(data) {
    try { localStorage.setItem(PRAYER_KEY, JSON.stringify({ ...data, at: Date.now() })); } catch(_) {}
}

// ── Vakitleri Proxy Üzerinden Çek ─────────────────────────────────
async function fetchPrayer() {
    const res = await fetch(PROXY_URL);
    if (!res.ok) throw new Error('Proxy HTTP ' + res.status);
    const data = await res.json();
    const payload = data?.data ?? data;
    
    let d = null;
    if (Array.isArray(payload)) {
        // Erstellt das heutige Datum exakt im Diyanet-Format (z.B. "04.10.2026")
        const now = new Date();
        const day = String(now.getDate()).padStart(2, '0');
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const year = now.getFullYear();
        const todayStr = `${day}.${month}.${year}`;

        // Sucht exakt den Eintrag für heute aus der Wochenliste heraus
        d = payload.find(item => item.gregorianDateShort === todayStr) || payload[0];
    } else {
        d = payload;
    }

    const times = [
        hhmm(d.fajr),
        hhmm(d.sunrise),
        hhmm(d.dhuhr),
        hhmm(d.asr),
        hhmm(d.maghrib),
        hhmm(d.isha)
    ];
    if (times.some(t => !t)) throw new Error('Eksik vakit alanı');
    
    const hijri = d.hijriDateLong ?? d.hijriDateShort ?? '';
    const miladi = d.gregorianDateLong ?? '';
    const dateStr = new Date().toDateString(); 
    
    savePrayer({ times, hijri, miladi, dateStr }); 
    return { times, hijri, miladi };
}

async function loadData() {
    try {
        const raw = localStorage.getItem(PRAYER_KEY);
        if (raw) {
            const c = JSON.parse(raw);
            if (c?.dateStr === new Date().toDateString() && c?.times?.length === 6) {
                prayers = c.times;
                renderAll(c.hijri, c.miladi);
                return;
            }
        }

        const r = await fetchPrayer();
        prayers = r.times;
        renderAll(r.hijri, r.miladi);
    } catch(e) {
        console.error('Vakit yükleme hatası:', e.message);
        try {
            const raw = localStorage.getItem(PRAYER_KEY);
            if (raw) {
                const c = JSON.parse(raw);
                if (c?.times?.length === 6) {
                    prayers = c.times;
                    renderAll(c.hijri, c.miladi);
                }
            }
        } catch(_) {
            document.getElementById('status-display').innerHTML = 
                `<span style="color:#c00;font-size:1.3rem">⚠️ Vakit yüklenemedi</span>`;
        }
    }
}

function renderAll(hijri, miladi) {
    prayers.forEach((t, i) => {
        const el = document.getElementById(`t${i}`);
        if (el) el.innerText = t;
    });
    if (hijri) {
        document.getElementById('hicri-date').innerText = hijri;
    }
}

// ── Geri Sayım Motoru & Highlighting ──────────────────────────────
function engine() {
    if (!prayers.length || !prayers[0] || prayers[0] === '--:--') return;
    
    const now = new Date();
    const cur = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
    
    const toS = s => { const [h, m] = s.split(':').map(Number); return h * 3600 + m * 60; };
    const secs = prayers.map(toS);
    
    let ai = -1; // ai ist der Index der aktuellen Gebetszeit (0 = İmsak, 1 = Güneş, 2 = Öğle...)
    for (let i = 0; i < 6; i++) { if (cur >= secs[i]) ai = i; }
    if (ai === -1) ai = 5;
    
    // Zuweisung der "active" Klasse an die korrekte Zelle
    document.querySelectorAll('.vakit-card').forEach((c, i) => {
        let isActive = false;
        
        // Wenn es İmsak (0) oder Güneş (1) ist, markiere die GEMEINSAME erste Zelle (Index 0)
        if (ai === 0 || ai === 1) {
            if (i === 0) isActive = true;
        } 
        // Ansonsten markiere die exakt passende Zelle
        else {
            if (i === ai) isActive = true;
        }
        
        c.classList.toggle('active', isActive);
    });
    
    const ni = (ai + 1) % 6;
    let diff = secs[ni] - cur;
    if (diff < 0) diff += 86400;
    
    const h = Math.floor(diff / 3600);
    const m = Math.floor((diff % 3600) / 60);
    const s = diff % 60;
    const pad = n => String(n).padStart(2, '0');
    
    const lbl = vakitNames[ni] === 'Güneş' 
        ? 'Güneşin Doğmasına Kalan Süre:' 
        : `${vakitNames[ni]} Vaktine Kalan Süre:`;
        
    document.getElementById('status-display').innerHTML = 
        `${lbl}<span class="countdown-timer">${pad(h)}:${pad(m)}:${pad(s)}</span>`;
}

// ── Hava Durumu ───────────────────────────────────────────────────
function wxDesc(code, isDay) {
    if (code <= 1) return isDay ? 'Güneşli' : 'Açık Gökyüzü';
    return ({
        2:'Az Bulutlu', 3:'Bulutlu', 45:'Sisli', 48:'Kırağı',
        51:'Hafif Çiseleme', 53:'Çiseleme', 55:'Yoğun Çiseleme',
        61:'Hafif Yağmur', 63:'Yağmurlu', 65:'Yoğun Yağmur',
        71:'Hafif Kar', 73:'Kar', 75:'Yoğun Kar',
        80:'Sağanak', 81:'Kuvvetli Sağanak', 82:'Şiddetli Sağanak',
        95:'Gök Gürültülü', 96:'Dolu', 99:'Şiddetli Dolu'
    })[code] ?? 'Parçalı Bulutlu';
}
async function updateWeather() {
    try {
        const res = await fetch(
            `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}` +
            `&current=temperature_2m,relative_humidity_2m,apparent_temperature,surface_pressure,wind_speed_10m,weather_code,is_day`
        );
        const d = (await res.json()).current;
        
        const w = {
            temp: Math.round(d.temperature_2m),
            feel: Math.round(d.apparent_temperature),
            hum:  d.relative_humidity_2m,
            wind: Math.round(d.wind_speed_10m),
            pres: Math.round(d.surface_pressure),
            desc: wxDesc(d.weather_code, d.is_day === 1),
            at:   Date.now()
        };
        
        try { localStorage.setItem(WEATHER_KEY, JSON.stringify(w)); } catch(_) {}
        renderWeather(w);
    } catch(e) {
        console.error('Hava durumu hatası:', e);
        try {
            const w = JSON.parse(localStorage.getItem(WEATHER_KEY));
            if (w) renderWeather(w);
        } catch(_) {}
    }
}
function renderWeather(w) {
    document.getElementById('w-temp').innerText = w.temp + '°C';
    document.getElementById('w-feel').innerText = w.feel + '°C';
    document.getElementById('w-hum').innerText  = w.hum  + '%';
    document.getElementById('w-wind').innerText = w.wind + ' km/sa';
    document.getElementById('w-pres').innerText = w.pres + ' hPa';
    document.getElementById('w-desc').innerText = w.desc;
}

function updateClocks() {
    const now = new Date();
    document.getElementById('clock').innerText = 
        now.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
    document.getElementById('miladi-date').innerText = 
        now.toLocaleDateString('tr-TR', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
}

// ── Start ─────────────────────────────────────────────────────────
updateClocks();
loadData();
updateWeather();

setInterval(() => { updateClocks(); engine(); }, 1000);
setInterval(updateWeather, WEATHER_TTL);

function scheduleMidnightFetch() {
    const now = new Date();
    const nextMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 1, 0);
    const msUntilMidnight = nextMidnight - now;
    
    setTimeout(() => {
        loadData();
        scheduleMidnightFetch();
    }, msUntilMidnight);
}
scheduleMidnightFetch();
</script>
</body>
</html>
