<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hohenlimburg Camii Namaz Panosu</title>
    <style>
        :root {
            --primary: #004d40;
            --accent: #ffc107;
            --glass: rgba(255, 255, 255, 0.95);
            --text: #2c3e50;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: linear-gradient(135deg, #004d40 0%, #00251a 100%);
            color: var(--text);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .main-container {
            width: 96vw;
            height: 94vh;
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            grid-template-rows: auto 1fr auto;
            gap: 30px;
            background: var(--glass);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
        }

        @media (max-aspect-ratio: 1/1) {
            .main-container {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto 1fr auto;
                height: 98vh;
                overflow-y: auto;
            }
        }

        .header {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 20px;
        }

        .logo-area { display: flex; align-items: center; gap: 30px; }
        .logo-area img { height: 120px; }
        .logo-area h1 { font-size: 3.8rem; color: var(--primary); font-weight: 800; letter-spacing: -1px; }

        .header-right-group {
            display: flex;
            align-items: center;
            gap: 40px;
        }

        .date-area { text-align: right; }
        .date-area .miladi { font-size: 1.6rem; font-weight: bold; }
        .date-area .hicri { color: var(--primary); font-size: 1.4rem; font-weight: 600; margin-top: 5px; }

        .live-clock {
            font-size: 5rem;
            font-weight: 900;
            color: var(--primary);
            line-height: 1;
            border-left: 4px solid #eee;
            padding-left: 35px;
        }

        .vakitler-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 20px;
            grid-column: 1 / -1;
            height: 100%;
        }

        .vakit-card {
            background: #f8f9fa;
            padding: 30px 20px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: all 0.3s ease;
            border: 2px solid #ddd;
        }

        .vakit-card.active {
            background: var(--primary);
            color: white;
            transform: scale(1.05);
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
            border: none;
        }

        .vakit-card .label { font-size: 1.8rem; text-transform: uppercase; margin-bottom: 15px; font-weight: 700; opacity: 0.9; }
        .vakit-card .time { font-size: 4rem; font-weight: 800; }

        .countdown-box {
            background: #e0f2f1;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }
        
        #status-display {
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
        }

        .countdown-timer {
            font-size: 5.5rem;
            font-weight: 900;
            color: var(--primary);
            font-variant-numeric: tabular-nums;
            display: block;
            margin-top: 15px;
            line-height: 1;
        }

        .weather-box {
            background: #fff;
            border-radius: 24px;
            padding: 30px;
            border: 2px solid #eee;
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            align-items: center;
            gap: 20px;
        }

        .weather-main { text-align: center; }
        .weather-main .temp { font-size: 4.8rem; font-weight: bold; color: var(--primary); margin: 5px 0; }
        #w-desc { font-size: 1.6rem; font-weight: 600; color: #555; text-transform: capitalize; }
        
        .weather-details { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 15px; 
            font-size: 1.3rem;
            border-left: 2px solid #eee;
            padding-left: 30px;
        }
        
        .w-item { display: flex; flex-direction: column; gap: 5px; }
        .w-item span:first-child { font-weight: bold; color: #777; }
    </style>
</head>
<body>

<div class="main-container">
    <header class="header">
        <div class="logo-area">
            <img src="https://upload.wikimedia.org/wikipedia/de/6/62/DITIB-Logo.svg" alt="DİTİB">
            <h1>Hohenlimburg Camii</h1>
        </div>
        
        <div class="header-right-group">
            <div class="date-area">
                <div class="miladi" id="miladi-date">-- --- ----</div>
                <div class="hicri" id="hicri-date">-- --- ----</div>
            </div>
            <div class="live-clock" id="clock">00:00</div>
        </div>
    </header>

    <div class="vakitler-grid" id="vakitler-container">
        <div class="vakit-card"><div class="label">İmsak</div><div class="time" id="t0">--:--</div></div>
        <div class="vakit-card"><div class="label">Güneş</div><div class="time" id="t1">--:--</div></div>
        <div class="vakit-card"><div class="label">Öğle</div><div class="time" id="t2">--:--</div></div>
        <div class="vakit-card"><div class="label">İkindi</div><div class="time" id="t3">--:--</div></div>
        <div class="vakit-card"><div class="label">Akşam</div><div class="time" id="t4">--:--</div></div>
        <div class="vakit-card"><div class="label">Yatsı</div><div class="time" id="t5">--:--</div></div>
    </div>

    <div class="countdown-box" id="status-display">
        Yükleniyor...
    </div>

    <div class="weather-box">
        <div class="weather-main">
            <div style="font-size: 1.5rem; font-weight: 600;">Hava Durumu</div>
            <div class="temp" id="w-temp">--°C</div>
            <div id="w-desc">--</div>
        </div>
        <div class="weather-details">
            <div class="w-item"><span>Hissedilen</span><span id="w-feel">--°C</span></div>
            <div class="w-item"><span>Nem</span><span id="w-hum">%--</span></div>
            <div class="w-item"><span>Rüzgar</span><span id="w-wind">-- km/sa</span></div>
            <div class="w-item"><span>Basınç</span><span id="w-pres">-- hPa</span></div>
        </div>
    </div>
</div>

<script>
    const LAT = 51.3508;
    const LON = 7.5683;
    const PRAYER_API_BASE = 'https://ezanvakti.imsakiyem.com/api';
    const DISTRICT_NAME = 'hohenlimburg';
    const DISTRICT_ID_FALLBACK = '10028';
    const PRAYER_CACHE_KEY = 'prayer-times-v2';
    const PRAYER_CACHE_MAX_AGE_MS = 36 * 60 * 60 * 1000;
    
    let prayers = [];
    const vakitNames = ["İmsak", "Güneş", "Öğle", "İkindi", "Akşam", "Yatsı"];

    function normalizeTime(raw) {
        if (!raw || typeof raw !== 'string') return null;
        const match = raw.match(/\d{1,2}:\d{2}/);
        if (!match) return null;
        const [h, m] = match[0].split(':').map(Number);
        return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
    }

    function extractPrayerTimesFromApi(payload) {
        const t = payload?.data?.[0]?.times;
        if (!t) return null;
        const mapped = [
            normalizeTime(t.imsak), normalizeTime(t.gunes), normalizeTime(t.ogle),
            normalizeTime(t.ikindi), normalizeTime(t.aksam), normalizeTime(t.yatsi)
        ];
        return mapped.every(Boolean) ? mapped : null;
    }

    async function fetchJsonWithTimeout(url, timeoutMs = 9000) {
        const ctl = new AbortController();
        const timer = setTimeout(() => ctl.abort(), timeoutMs);
        try {
            const res = await fetch(url, { signal: ctl.signal, cache: 'no-store' });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return await res.json();
        } finally { clearTimeout(timer); }
    }

    async function resolveDistrictId() {
        try {
            const payload = await fetchJsonWithTimeout(`${PRAYER_API_BASE}/locations/search/districts?q=${encodeURIComponent(DISTRICT_NAME)}`);
            const first = payload?.data?.[0];
            if (first?._id) return String(first._id);
        } catch (_) {}
        return DISTRICT_ID_FALLBACK;
    }

    function savePrayerCache(times) {
        try { localStorage.setItem(PRAYER_CACHE_KEY, JSON.stringify({ times, savedAt: Date.now() })); } catch (_) {}
    }

    function loadPrayerCache() {
        try {
            const raw = localStorage.getItem(PRAYER_CACHE_KEY);
            if (!raw) return null;
            const parsed = JSON.parse(raw);
            if (!Array.isArray(parsed?.times) || parsed.times.length !== 6) return null;
            if (!parsed.savedAt || (Date.now() - parsed.savedAt) > PRAYER_CACHE_MAX_AGE_MS) return null;
            return parsed.times;
        } catch (_) { return null; }
    }

    async function loadData() {
        try {
            const districtId = await resolveDistrictId();
            const payload = await fetchJsonWithTimeout(`${PRAYER_API_BASE}/prayer-times/${districtId}/daily`);
            const extracted = extractPrayerTimesFromApi(payload);
            if (!extracted) throw new Error('Format hatası');
            prayers = extracted;
            renderTimes();
            savePrayerCache(prayers);
        } catch (e) {
            const cached = loadPrayerCache();
            if (cached) { prayers = cached; renderTimes(); }
        }
    }

    function renderTimes() {
        prayers.forEach((t, i) => {
            const el = document.getElementById(`t${i}`);
            if (el) el.innerText = t || '--:--';
        });
    }

    function engine() {
        if (prayers.length < 6 || !prayers[0]) return;
        const now = new Date();
        const curSecs = (now.getHours() * 3600) + (now.getMinutes() * 60) + now.getSeconds();
        const parseToSecs = (s) => {
            const [h, m] = s.split(':').map(Number);
            return (h * 3600) + (m * 60);
        };
        const minsInSecs = prayers.map(parseToSecs);
        
        let activeIdx = -1;
        for (let i = 0; i < 6; i++) { if (curSecs >= minsInSecs[i]) activeIdx = i; }
        if (activeIdx === -1) activeIdx = 5;
        
        document.querySelectorAll('.vakit-card').forEach((c, i) => {
            c.classList.toggle('active', i === activeIdx);
        });
        
        let nextIdx = (activeIdx + 1) % 6;
        let diff = minsInSecs[nextIdx] - curSecs;
        if (diff < 0) diff += 86400;
        
        const h = Math.floor(diff / 3600);
        const m = Math.floor((diff % 3600) / 60);
        const s = diff % 60;
        
        const nextVakitName = vakitNames[nextIdx];
        let labelText = `${nextVakitName} Vaktine Kalan Süre:`;
        if (nextVakitName === "Güneş") {
            labelText = "Güneşin Doğmasına Kalan Süre:";
        }
        
        document.getElementById('status-display').innerHTML = `${labelText} <span class="countdown-timer">${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}</span>`;
    }

    function translateWeather(code, isDay) {
        // 0 ve 1 kodları açık havayı temsil eder
        if (code <= 1) return isDay ? "Güneşli" : "Açık Gökyüzü";
        
        const codes = {
            2: "Az Bulutlu", 3: "Bulutlu",
            45: "Sisli", 48: "Kırağı Oluşumu",
            51: "Hafif Çiseleme", 53: "Çiseleme", 55: "Yoğun Çiseleme",
            61: "Hafif Yağmurlu", 63: "Yağmurlu", 65: "Yoğun Yağmurlu",
            71: "Hafif Kar Yağışlı", 73: "Kar Yağışlı", 75: "Yoğun Kar Yağışlı",
            80: "Sağanak Yağışlı", 81: "Kuvvetli Sağanak", 82: "Şiddetli Sağanak",
            95: "Gök Gürültülü Sağanak", 96: "Dolu Yağışlı", 99: "Şiddetli Dolu"
        };
        return codes[code] || "Parçalı Bulutlu";
    }

    async function updateWeather() {
        try {
            const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,relative_humidity_2m,apparent_temperature,surface_pressure,wind_speed_10m,weather_code,is_day`);
            const d = await res.json();
            const c = d.current;
            document.getElementById('w-temp').innerText = Math.round(c.temperature_2m) + "°C";
            document.getElementById('w-feel').innerText = Math.round(c.apparent_temperature) + "°C";
            document.getElementById('w-hum').innerText  = c.relative_humidity_2m + "%";
            document.getElementById('w-wind').innerText = Math.round(c.wind_speed_10m) + " km/sa";
            document.getElementById('w-pres').innerText = Math.round(c.surface_pressure) + " hPa";
            // Gündüz/Gece bilgisini fonksiyona gönderiyoruz
            document.getElementById('w-desc').innerText = translateWeather(c.weather_code, c.is_day === 1);
        } catch (e) { console.error("Hava durumu hatası"); }
    }

    function updateClocks() {
        const now = new Date();
        document.getElementById('clock').innerText = now.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
        document.getElementById('miladi-date').innerText = now.toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric', weekday: 'long' });
        try {
            const hicriFormatter = new Intl.DateTimeFormat('tr-TR-u-ca-islamic-umalqura', { day: 'numeric', month: 'long', year: 'numeric' });
            document.getElementById('hicri-date').innerText = hicriFormatter.format(now);
        } catch(e) { document.getElementById('hicri-date').innerText = ""; }
    }

    setInterval(() => { updateClocks(); engine(); }, 1000);
    setInterval(loadData, 3600000);
    setInterval(updateWeather, 900000);
    
    updateClocks(); 
    loadData(); 
    updateWeather();
</script>

</body>
</html>
